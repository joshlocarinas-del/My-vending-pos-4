        <div style={styles.totalsBlock}>
          <Row label="Item value" value={fmt(sale.rawTotal)} />
          {sale.rate && <Row label={`${m.label} rate`} value={`${sale.rate}%`} />}
          {sale.mode === "sell" && sale.creditApplied > 0 && (
            <Row label="Store credit applied" value={`− ${fmt(sale.creditApplied)}`} />
          )}
          {sale.mode === "sell" && sale.creditCashback > 0 && (
            <Row
              label={`Cash back (${sale.creditCashoutRatePct}% of leftover credit)`}
              value={fmt(sale.creditCashback)}
            />
          )}
          {sale.mode === "trade" && sale.cashOut > 0 && (
            <>
              <Row label="Paid as cash" value={fmt(sale.cashOut)} />
              <Row label="Issued as credit" value={fmt(sale.creditIssued)} />
            </>
          )}
          <div style={styles.totalRow}>
            <span>
              {sale.mode === "sell" ? "Due" : sale.mode === "buy" ? "Cash paid" : "Trade value"}
            </span>
            <span>{fmt(sale.mode === "sell" ? sale.dueAfterCredit : sale.total)}</span>
          </div>
          {sale.mode === "sell" && sale.method === "cash" && (
            <Row label="Change given" value={fmt(sale.change)} />
          )}
        </div>
        <button style={{ ...styles.newSaleBtn, background: m.color }} onClick={onClose}>
          Start next transaction
        </button>
      </div>
    </div>
  );
}

function SettingsView({ categories, setCategories, products, setProducts, history, setHistory, customers, setCustomers, shopName, setShopName }) {
  const [newCat, setNewCat] = useState("");
  const [draft, setDraft] = useState({ name: "", value: "", cost: "", stock: "", cat: categories[0] || "", tag: "", url: "", condition: "" });
  const [confirmingReset, setConfirmingReset] = useState(false);
  const [confirmingCreditClear, setConfirmingCreditClear] = useState(false);
  const [adjustingCustomerId, setAdjustingCustomerId] = useState(null);
  const [creditAdjustAmount, setCreditAdjustAmount] = useState("");
  const [newCustomerName, setNewCustomerName] = useState("");
  const [newCustomerAmount, setNewCustomerAmount] = useState("");
  const [confirmingDeleteCustomerId, setConfirmingDeleteCustomerId] = useState(null);
  const [dupeFixResult, setDupeFixResult] = useState(null);
  const [publishStatus, setPublishStatus] = useState("");

  const totalCreditOwed = customers.reduce((s, c) => s + (c.creditBalance || 0), 0);

  function applyCreditAdjust(customerId) {
    const v = parseFloat(creditAdjustAmount);
    if (isNaN(v) || v === 0) return;
    setCustomers((prev) =>
      prev.map((c) =>
        c.id === customerId ? { ...c, creditBalance: Math.max(0, Math.round((c.creditBalance + v) * 100) / 100) } : c
      )
    );
    setCreditAdjustAmount("");
    setAdjustingCustomerId(null);
  }

  function addCustomer() {
    const name = newCustomerName.trim();
    const amount = parseFloat(newCustomerAmount);
    if (!name) return;
    setCustomers((prev) => [
      ...prev,
      { id: newProductId(), name, creditBalance: isNaN(amount) ? 0 : Math.max(0, amount) },
    ]);
    setNewCustomerName("");
    setNewCustomerAmount("");
  }

  function deleteCustomer(customerId) {
    setCustomers((prev) => prev.filter((c) => c.id !== customerId));
    setConfirmingDeleteCustomerId(null);
  }

  const duplicateIdCount = (() => {
    const seen = new Set();
    let dupes = 0;
    products.forEach((p) => {
      if (seen.has(p.id)) dupes += 1;
      else seen.add(p.id);
    });
    return dupes;
  })();

  function fixDuplicateIds() {
    const seen = new Set();
    let fixedCount = 0;
    const fixed = products.map((p) => {
      if (seen.has(p.id)) {
        fixedCount += 1;
        return { ...p, id: newProductId() };
      }
      seen.add(p.id);
      return p;
    });
    setProducts(fixed);
    setDupeFixResult(fixedCount);
  }

  function renameCategory(oldName, newName) {
    const clean = newName.trim();
    if (!clean || clean === oldName) return;
    setCategories((prev) => prev.map((c) => (c === oldName ? clean : c)));
    setProducts((prev) => prev.map((p) => (p.cat === oldName ? { ...p, cat: clean } : p)));
  }

  function deleteCategory(name) {
    const remaining = categories.filter((c) => c !== name);
    setCategories(remaining);
    const fallback = remaining[0] || "Uncategorized";
    setProducts((prev) => prev.map((p) => (p.cat === name ? { ...p, cat: fallback } : p)));
  }

  function addCategory() {
    const clean = newCat.trim();
    if (!clean || categories.includes(clean)) return;
    setCategories((prev) => [...prev, clean]);
    setNewCat("");
  }

  function updateProduct(id, field, val) {
    setProducts((prev) => prev.map((p) => (p.id === id ? { ...p, [field]: val } : p)));
  }

  function deleteProduct(id) {
    setProducts((prev) => prev.filter((p) => p.id !== id));
  }

  function addProduct() {
    const name = draft.name.trim();
    const value = parseFloat(draft.value);
    const cost = draft.cost === "" ? 0 : parseFloat(draft.cost);
    const stock = draft.stock === "" ? 0 : parseInt(draft.stock);
    if (!name || isNaN(value) || value < 0 || !draft.cat) return;
    setProducts((prev) => [
      ...prev,
      {
        id: newProductId(),
        name,
        value,
        cost: isNaN(cost) ? 0 : cost,
        stock: isNaN(stock) ? 0 : Math.max(0, stock),
        cat: draft.cat,
        condition: isSinglesCategory(draft.cat) ? draft.condition : "",
        tag: draft.tag.trim().slice(0, 4).toUpperCase() || "—",
        url: draft.url.trim(),
      },
    ]);
    setDraft({ name: "", value: "", cost: "", stock: "", cat: draft.cat, tag: "", url: "", condition: "" });
  }

  return (
    <div style={styles.settingsWrap}>
      {/* Categories */}
      <div style={styles.settingsSection}>
        <div style={styles.settingsHeading}>Categories</div>
        <div style={styles.catEditList}>
          {categories.map((c) => (
            <div key={c} style={styles.catEditRow}>
              <Pencil size={12} color={MUTED} />
              <input
                style={styles.catEditInput}
                defaultValue={c}
                onBlur={(e) => renameCategory(c, e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
              />
              <button className="icon-btn" style={styles.iconBtn} onClick={() => deleteCategory(c)} aria-label={`Delete ${c}`}>
                <Trash2 size={14} color={MUTED} />
              </button>
            </div>
          ))}
        </div>
        <div style={styles.addRow}>
          <input
            style={styles.addInput}
            placeholder="New category name"
            value={newCat}
            onChange={(e) => setNewCat(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addCategory()}
          />
          <button style={styles.addBtn} onClick={addCategory}>
            <Plus size={14} /> Add category
          </button>
        </div>
      </div>

      {/* Products */}
      <div style={styles.settingsSection}>
        <div style={styles.settingsHeading}>Products</div>
        <div style={styles.productTable}>
          <div style={styles.productTableHead}>
            <span style={{ flex: 2 }}>Name</span>
            <span style={{ width: 80 }}>Cost</span>
            <span style={{ width: 80 }}>Value</span>
            <span style={{ width: 70 }}>Margin</span>
            <span style={{ width: 60 }}>Stock</span>
            <span style={{ width: 130 }}>Category</span>
            <span style={{ width: 70 }}>Condition</span>
            <span style={{ width: 56 }}>Tag</span>
            <span style={{ width: 140 }}>Link</span>
            <span style={{ width: 32 }} />
          </div>
          {products.map((p) => {
            const cost = p.cost || 0;
            const margin = p.value - cost;
            const marginPct = p.value > 0 ? (margin / p.value) * 100 : 0;
            return (
              <div key={p.id} style={styles.productTableRow}>
                <input
                  style={{ ...styles.tableInput, flex: 2 }}
                  defaultValue={p.name}
                  onBlur={(e) => updateProduct(p.id, "name", e.target.value)}
                />
                <input
                  style={{ ...styles.tableInput, width: 80 }}
                  type="number"
                  step="0.01"
                  min="0"
                  defaultValue={p.cost}
                  onBlur={(e) => updateProduct(p.id, "cost", parseFloat(e.target.value) || 0)}
                />
                <input
                  style={{ ...styles.tableInput, width: 80 }}
                  type="number"
                  step="0.01"
                  min="0"
                  defaultValue={p.value}
                  onBlur={(e) => updateProduct(p.id, "value", parseFloat(e.target.value) || 0)}
                />
                <span style={{ ...styles.marginTag, color: margin >= 0 ? TEAL : "#B0413E" }}>
                  {fmt(margin)}
                  <span style={styles.marginPct}> ({marginPct.toFixed(0)}%)</span>
                </span>
                <input
                  style={{ ...styles.tableInput, width: 60 }}
                  type="number"
                  step="1"
                  min="0"
                  defaultValue={p.stock ?? 0}
                  onBlur={(e) => updateProduct(p.id, "stock", Math.max(0, parseInt(e.target.value) || 0))}
                />
                <select
                  style={{ ...styles.tableInput, width: 130 }}
                  value={p.cat}
                  onChange={(e) => updateProduct(p.id, "cat", e.target.value)}
                >
                  {categories.map((c) => (
                    <option key={c} value={c}>{c}</option>
                  ))}
                </select>
                {isSinglesCategory(p.cat) ? (
                  <select
                    style={{ ...styles.tableInput, width: 70 }}
                    value={p.condition || ""}
                    onChange={(e) => updateProduct(p.id, "condition", e.target.value)}
                  >
                    <option value="">—</option>
                    {CONDITIONS.map((c) => (
                      <option key={c.value} value={c.value}>{c.value}</option>
                    ))}
                  </select>
                ) : (
                  <span style={{ width: 70, color: MUTED, fontSize: 12, textAlign: "center" }}>—</span>
                )}
                <input
                  style={{ ...styles.tableInput, width: 56, textTransform: "uppercase" }}
                  defaultValue={p.tag}
                  maxLength={4}
                  onBlur={(e) => updateProduct(p.id, "tag", e.target.value.toUpperCase())}
                />
                <div style={styles.linkCell}>
                  <input
                    style={{ ...styles.tableInput, width: 100 }}
                    type="url"
                    placeholder="Paste link"
                    defaultValue={p.url || ""}
                    onBlur={(e) => updateProduct(p.id, "url", e.target.value.trim())}
                  />
                  <button
                    className="icon-btn"
                    style={{ ...styles.iconBtn, width: 32, opacity: p.url ? 1 : 0.3 }}
                    onClick={() => p.url && window.open(p.url, "_blank", "noopener,noreferrer")}
                    disabled={!p.url}
                    aria-label={`Open link for ${p.name}`}
                  >
                    <LinkIcon size={13} color={MUTED} />
                  </button>
                </div>
                <button
                  className="icon-btn"
                  style={{ ...styles.iconBtn, width: 32 }}
                  onClick={() => deleteProduct(p.id)}
                  aria-label={`Delete ${p.name}`}
                >
                  <Trash2 size={14} color={MUTED} />
                </button>
              </div>
            );
          })}
        </div>

        <div style={styles.addProductRow}>
          <input
            style={{ ...styles.tableInput, flex: 2 }}
            placeholder="New product name"
            value={draft.name}
            onChange={(e) => setDraft({ ...draft, name: e.target.value })}
          />
          <input
            style={{ ...styles.tableInput, width: 80 }}
            type="number"
            step="0.01"
            min="0"
            placeholder="Cost"
            value={draft.cost}
            onChange={(e) => setDraft({ ...draft, cost: e.target.value })}
          />
          <input
            style={{ ...styles.tableInput, width: 80 }}
            type="number"
            step="0.01"
            min="0"
            placeholder="Value"
            value={draft.value}
            onChange={(e) => setDraft({ ...draft, value: e.target.value })}
          />
          <span style={{ width: 70 }} />
          <input
            style={{ ...styles.tableInput, width: 60 }}
            type="number"
            step="1"
            min="0"
            placeholder="Stock"
            value={draft.stock}
            onChange={(e) => setDraft({ ...draft, stock: e.target.value })}
          />
          <select
            style={{ ...styles.tableInput, width: 130 }}
            value={draft.cat}
            onChange={(e) => setDraft({ ...draft, cat: e.target.value })}
          >
            {categories.map((c) => (
              <option key={c} value={c}>{c}</option>
            ))}
          </select>
          {isSinglesCategory(draft.cat) ? (
            <select
              style={{ ...styles.tableInput, width: 70 }}
              value={draft.condition}
              onChange={(e) => setDraft({ ...draft, condition: e.target.value })}
            >
              <option value="">—</option>
              {CONDITIONS.map((c) => (
                <option key={c.value} value={c.value}>{c.value}</option>
              ))}
            </select>
          ) : (
            <span style={{ width: 70 }} />
          )}
          <input
            style={{ ...styles.tableInput, width: 56 }}
            placeholder="TAG"
            value={draft.tag}
            onChange={(e) => setDraft({ ...draft, tag: e.target.value })}
            maxLength={4}
          />
          <input
            style={{ ...styles.tableInput, width: 140 }}
            type="url"
            placeholder="Link (optional)"
            value={draft.url}
            onChange={(e) => setDraft({ ...draft, url: e.target.value })}
          />
          <button style={styles.addBtn} onClick={addProduct}>
            <Plus size={14} /> Add
          </button>
        </div>
      </div>

      <div style={styles.settingsSection}>
        <div style={styles.settingsHeading}>Customers</div>
        <div style={styles.dataNote}>
          Total owed across everyone: <strong>{fmt(totalCreditOwed)}</strong>. A customer's credit is
          automatically applied the next time they're selected on a sale.
        </div>

        {customers.length === 0 ? (
          <div style={styles.emptyCart}>
            No customers yet — they're added automatically when you trade something in, or you can add one below.
          </div>
        ) : (
          <div style={styles.customerTable}>
            <div style={styles.customerTableHead}>
              <span style={{ flex: 2 }}>Name</span>
              <span style={{ width: 110 }}>Credit</span>
              <span style={{ width: 32 }} />
            </div>
            {customers.map((c) => (
              <div key={c.id} style={styles.customerTableRow}>
                <input
                  style={{ ...styles.tableInput, flex: 2 }}
                  defaultValue={c.name}
                  onBlur={(e) => {
                    const name = e.target.value.trim();
                    if (name) setCustomers((prev) => prev.map((x) => (x.id === c.id ? { ...x, name } : x)));
                  }}
                />
                {adjustingCustomerId === c.id ? (
                  <div style={styles.customerAdjustRow}>
                    <input
                      type="number"
                      step="0.01"
                      placeholder="+50 or -20"
                      value={creditAdjustAmount}
                      onChange={(e) => setCreditAdjustAmount(e.target.value)}
                      style={styles.fundsAddInput}
                      autoFocus
                      onKeyDown={(e) => e.key === "Enter" && applyCreditAdjust(c.id)}
                    />
                    <button style={styles.fundsAddConfirm} onClick={() => applyCreditAdjust(c.id)}>Save</button>
                    <button
                      style={styles.fundsAddCancel}
                      onClick={() => { setAdjustingCustomerId(null); setCreditAdjustAmount(""); }}
                    >
                      <X size={13} />
                    </button>
                  </div>
                ) : (
                  <button
                    style={{ ...styles.tableInput, width: 110, textAlign: "left", cursor: "pointer" }}
                    onClick={() => { setAdjustingCustomerId(c.id); setCreditAdjustAmount(""); }}
                  >
                    {fmt(c.creditBalance)}
                  </button>
                )}
                {confirmingDeleteCustomerId === c.id ? (
                  <div style={styles.customerDeleteConfirmRow}>
                    <button style={styles.resetConfirmBtn} onClick={() => deleteCustomer(c.id)}>Yes</button>
                    <button style={styles.resetCancelBtn} onClick={() => setConfirmingDeleteCustomerId(null)}>No</button>
                  </div>
                ) : (
                  <button
                    className="icon-btn"
                    style={{ ...styles.iconBtn, width: 32 }}
                    onClick={() => setConfirmingDeleteCustomerId(c.id)}
                    aria-label={`Delete ${c.name}`}
                  >
                    <Trash2 size={14} color={MUTED} />
                  </button>
                )}
              </div>
            ))}
          </div>
        )}

        <div style={styles.addProductRow}>
          <input
            style={{ ...styles.tableInput, flex: 2 }}
            placeholder="New customer name"
            value={newCustomerName}
            onChange={(e) => setNewCustomerName(e.target.value)}
          />
          <input
            style={{ ...styles.tableInput, width: 110 }}
            type="number"
            step="0.01"
            min="0"
            placeholder="Starting credit"
            value={newCustomerAmount}
            onChange={(e) => setNewCustomerAmount(e.target.value)}
          />
          <button style={styles.addBtn} onClick={addCustomer}>
            <Plus size={14} /> Add
          </button>
        </div>
      </div>

      <div style={styles.settingsSection}>
        <div style={styles.settingsHeading}>Share Your Inventory</div>
        {typeof window !== "undefined" && window.catalogTools ? (
          <>
            <div style={styles.dataNote}>
              Publish a read-only page anyone can open — no sign-in needed — showing what you currently
              have in stock and its price. It only updates when you click Publish, so it's safe to sell
              at your own pace and update the public page whenever you're ready.
            </div>
            <label style={styles.customLabel}>Shop name (shown at the top of the page)</label>
            <input
              style={styles.customInput}
              placeholder="e.g. Josh's Card Shop"
              value={shopName}
              onChange={(e) => setShopName(e.target.value)}
            />
            <div style={styles.shareLinkRow}>
              <input style={{ ...styles.tableInput, flex: 1 }} readOnly value={window.catalogTools.shareUrl} />
              <button
                style={styles.exampleBtn}
                onClick={() => {
                  navigator.clipboard?.writeText(window.catalogTools.shareUrl);
                  setPublishStatus("Link copied!");
                  setTimeout(() => setPublishStatus(""), 2000);
                }}
              >
                Copy link
              </button>
            </div>
            <button
              style={styles.publishBtn}
              onClick={async () => {
                setPublishStatus("Publishing…");
                try {
                  const count = await window.catalogTools.publish(shopName, products);
                  setPublishStatus(`Published ${count} item${count === 1 ? "" : "s"}.`);
                } catch (e) {
                  setPublishStatus("Publish failed: " + e.message);
                }
              }}
            >
              Publish / update catalog
            </button>
            {publishStatus && <div style={styles.publishStatusNote}>{publishStatus}</div>}
          </>
        ) : (
          <div style={styles.dataNote}>
            Sign in with Google (from the sign-in screen) to get a shareable inventory link. This isn't
            available in test mode since it's tied to your account.
          </div>
        )}
      </div>

      <div style={styles.settingsSection}>
        <div style={styles.settingsHeading}>Data</div>
        <div style={styles.dataNote}>
          Your catalog and sales history are saved automatically and will still be here next time you open this.
        </div>

        {duplicateIdCount > 0 && (
          <div style={styles.dupeWarningBox}>
            <div style={styles.dupeWarningText}>
              Found {duplicateIdCount} product{duplicateIdCount > 1 ? "s" : ""} sharing an ID with another one —
              this can cause tapping one item to accidentally affect a different one. Fix it below.
            </div>
            <button style={styles.dupeFixBtn} onClick={fixDuplicateIds}>
              Fix duplicate product IDs
            </button>
          </div>
        )}
        {dupeFixResult !== null && (
          <div style={styles.dupeFixedNote}>
            {dupeFixResult > 0
              ? `Fixed ${dupeFixResult} product${dupeFixResult > 1 ? "s" : ""} with a duplicate ID.`
              : "No duplicate IDs found — nothing to fix."}
          </div>
        )}

        <div style={styles.exampleBtnRow}>
          <button
            style={styles.exampleBtn}
            onClick={() =>
              setProducts((prev) => prev.filter((p) => !p.name.includes("(example)")))
            }
          >
            Remove all example products
          </button>
          <button
            style={styles.exampleBtn}
            onClick={() =>
              setProducts((prev) => [
                ...prev,
                ...DEFAULT_PRODUCTS.filter(
                  (dp) => !prev.some((p) => p.name === dp.name && p.cat === dp.cat)
                ).map((dp) => ({ ...dp, id: newProductId() })),
              ])
            }
          >
            Add example products back
          </button>
          {totalCreditOwed > 0 && (
            <button style={styles.exampleBtn} onClick={() => setConfirmingCreditClear(true)}>
              Clear all store credit owed
            </button>
          )}
        </div>
        {confirmingCreditClear && (
          <div style={styles.resetConfirmRow}>
            <span style={styles.resetConfirmText}>
              Clear all {fmt(totalCreditOwed)} of store credit across every customer? This can't be undone.
            </span>
            <button
              style={styles.resetConfirmBtn}
              onClick={() => {
                setCustomers((prev) => prev.map((c) => ({ ...c, creditBalance: 0 })));
                setConfirmingCreditClear(false);
              }}
            >
              Yes, clear it
            </button>
            <button style={styles.resetCancelBtn} onClick={() => setConfirmingCreditClear(false)}>
              Cancel
            </button>
          </div>
        )}
        {!confirmingReset ? (
          <button style={styles.resetBtn} onClick={() => setConfirmingReset(true)}>
            Clear all sales history
          </button>
        ) : (
          <div style={styles.resetConfirmRow}>
            <span style={styles.resetConfirmText}>Clear all sales history? This can't be undone.</span>
            <button
              style={styles.resetConfirmBtn}
              onClick={() => { setHistory([]); setConfirmingReset(false); }}
            >
              Yes, clear it
            </button>
            <button style={styles.resetCancelBtn} onClick={() => setConfirmingReset(false)}>
              Cancel
            </button>
          </div>
        )}
      </div>
    </div>
  );
}
