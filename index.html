/* Builds a window.storage-compatible object backed by one Firestore doc per signed-in user */
function makeFirestoreStorage(uid) {
  const docRef = db.collection("posData").doc(uid);
  return {
    get: async (key) => {
      const snap = await docRef.get();
      const data = snap.exists ? snap.data() : {};
      if (!(key in data)) throw new Error("not found");
      return { key, value: data[key], shared: false };
    },
    set: async (key, value) => {
      await docRef.set({ [key]: value }, { merge: true });
      return { key, value, shared: false };
    },
    delete: async (key) => {
      await docRef.update({ [key]: firebase.firestore.FieldValue.delete() });
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const snap = await docRef.get();
      const data = snap.exists ? snap.data() : {};
      const keys = Object.keys(data).filter((k) => !prefix || k.startsWith(prefix));
      return { keys };
    },
  };
}

/* Publishes a public, read-only snapshot of sellable inventory anyone can view without signing in */
function makeCatalogTools(uid) {
  const catalogPath = window.location.pathname.replace(/index\.html$/, "").replace(/[^/]*$/, "");
  const shareUrl = `${window.location.origin}${catalogPath}catalog.html?shop=${uid}`;
  return {
    shareUrl,
    publish: async (shopName, products) => {
      const items = products
        .filter((p) => typeof p.stock !== "number" || p.stock > 0)
        .map((p) => ({
          name: p.name,
          value: p.value,
          cat: p.cat,
          tag: p.tag || "",
          condition: p.condition || "",
          url: p.url || "",
          stock: typeof p.stock === "number" ? p.stock : null,
        }));
      await db.collection("publicCatalogs").doc(uid).set({
        shopName: shopName || "Inventory",
        items,
        updatedAt: Date.now(),
      });
      return items.length;
    },
  };
}

/* Builds a window.storage-compatible object backed by browser localStorage (used for test mode, no account needed) */
function makeLocalStorage() {
  return {
    get: async (key) => {
      const raw = localStorage.getItem("test-" + key);
      if (raw === null) throw new Error("not found");
      return { key, value: raw, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem("test-" + key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem("test-" + key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix) => {
      const keys = Object.keys(localStorage)
        .filter((k) => k.startsWith("test-"))
        .map((k) => k.slice(5))
        .filter((k) => !prefix || k.startsWith(prefix));
      return { keys };
    },
  };
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    if (typeof console !== "undefined") console.error("Caught render error:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div
          style={{
            padding: 24,
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 13,
            color: "#B0413E",
            whiteSpace: "pre-wrap",
            lineHeight: 1.6,
          }}
        >
          Something went wrong loading this section:{"\n\n"}
          {this.state.error.message || String(this.state.error)}
          {"\n\n"}
          <button
            onClick={() => this.setState({ error: null })}
            style={{
              marginTop: 8,
              padding: "8px 16px",
              borderRadius: 8,
              border: "1px solid #B0413E",
              background: "none",
              color: "#B0413E",

              fontSize: 13,
              fontWeight: 600,
              cursor: "pointer",
            }}

  }
}

function newProductId() {
  return `p${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
}

// Older versions of this app could accidentally assign the same id to two different
// products across sessions. This repairs any such collisions by giving every duplicate
// past the first one a fresh, guaranteed-unique id.
function dedupeProductIds(products) {
  const seen = new Set();
  let changed = false;
  const fixed = products.map((p) => {
    if (!seen.has(p.id)) {
      seen.add(p.id);
      return p;
    }
    changed = true;
    const newId = newProductId();
    seen.add(newId);
    return { ...p, id: newId };
  });
  return changed ? fixed : products;
}

function POS() {
  const [view, setView] = useState("register"); // 'register' | 'history' | 'settings'
  const [mode, setMode] = useState("sell");
  const [category, setCategory] = useState("All");
  const [searchQuery, setSearchQuery] = useState("");
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [products, setProducts] = useState(DEFAULT_PRODUCTS);
  const [carts, setCarts] = useState({ sell: [], buy: [], trade: [] });
  const [payMethod, setPayMethod] = useState(null);
  const [cashGiven, setCashGiven] = useState("");
  const [buyRatePct, setBuyRatePct] = useState(70);
  const [tradeRatePct, setTradeRatePct] = useState(80);
  const [receipt, setReceipt] = useState(null);
  const [history, setHistory] = useState([]);
  const [customers, setCustomers] = useState([]); // [{ id, name, creditBalance }]
  const [selectedCustomerId, setSelectedCustomerId] = useState("");
  const [tradeCustomerName, setTradeCustomerName] = useState("");
  const [creditCashbackOverride, setCreditCashbackOverride] = useState("");
  const [cashOutAmount, setCashOutAmount] = useState(0);
  const [note, setNote] = useState("");
  const [funds, setFunds] = useState(0);
  const [shopName, setShopName] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);

  // Load saved data on mount
  useEffect(() => {
    async function load() {
      try {
        const configRes = await window.storage.get("pos-config", false);
        if (configRes && configRes.value) {
          const cfg = JSON.parse(configRes.value);
          if (cfg.categories) setCategories(cfg.categories);
          if (cfg.products) setProducts(dedupeProductIds(cfg.products));
          if (typeof cfg.buyRatePct === "number") setBuyRatePct(cfg.buyRatePct);
          if (typeof cfg.tradeRatePct === "number") setTradeRatePct(cfg.tradeRatePct);
          if (Array.isArray(cfg.customers)) {
            setCustomers(cfg.customers);
          } else if (typeof cfg.creditBalance === "number" && cfg.creditBalance > 0) {
            // Migrate old single shared credit balance into one customer record
            setCustomers([
              { id: newProductId(), name: "Unassigned credit (rename me)", creditBalance: cfg.creditBalance },
            ]);
          }
          if (typeof cfg.funds === "number") setFunds(cfg.funds);
          if (typeof cfg.shopName === "string") setShopName(cfg.shopName);
        }
      } catch (e) {
        // no saved config yet, keep defaults
      }
      try {
        const historyRes = await window.storage.get("pos-history", false);
        if (historyRes && historyRes.value) {
          const h = JSON.parse(historyRes.value).map((s) => ({ ...s, time: new Date(s.time) }));
          setHistory(h);
        }
      } catch (e) {
        // no saved history yet
      }
      setLoaded(true);
    }
    load();
  }, []);

  // Save catalog/settings whenever they change (after initial load)
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        const result = await window.storage.set(
          "pos-config",
          JSON.stringify({ categories, products, buyRatePct, tradeRatePct, customers, funds, shopName }),
          false
        );
        setSaveError(!result);
      } catch (e) {
        setSaveError(true);
      }
    })();
  }, [loaded, categories, products, buyRatePct, tradeRatePct, customers, funds, shopName]);

  // Save history whenever it changes (after initial load)
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        const result = await window.storage.set("pos-history", JSON.stringify(history), false);
        setSaveError((prev) => prev || !result);
      } catch (e) {
        setSaveError(true);
      }
    })();
  }, [loaded, history]);

  const cart = carts[mode];

  const visibleProducts = products
    .filter((p) => category === "All" || p.cat === category)
    .filter((p) => !searchQuery.trim() || p.name.toLowerCase().includes(searchQuery.trim().toLowerCase()));

  const rawTotal = useMemo(
    () => cart.reduce((sum, i) => sum + i.value * i.qty, 0),
    [cart]
  );

  function effectiveRatePct(item) {
    if (item.customRatePct != null) return item.customRatePct;
    return mode === "buy" ? buyRatePct : tradeRatePct;
  }

  const sellTotal = rawTotal;
  const buyPayout = cart.reduce((s, i) => s + i.value * i.qty * (effectiveRatePct(i) / 100), 0);
  const tradeCredit = cart.reduce((s, i) => s + i.value * i.qty * (effectiveRatePct(i) / 100), 0);
  const total = mode === "sell" ? sellTotal : mode === "buy" ? buyPayout : tradeCredit;
  const avgRatePct = rawTotal > 0 ? Math.round((total / rawTotal) * 100) : (mode === "buy" ? buyRatePct : tradeRatePct);
  const cashOutCapped = mode === "trade" ? Math.max(0, Math.min(cashOutAmount, total)) : 0;
  const creditPortion = mode === "trade" ? total - cashOutCapped : total;
  const totalCreditOwed = customers.reduce((s, c) => s + (c.creditBalance || 0), 0);
  const selectedCustomer = customers.find((c) => c.id === selectedCustomerId) || null;
  const customerCreditBalance = selectedCustomer ? selectedCustomer.creditBalance : 0;
  // A selected customer's credit is forced fully redeemed on this sale: applied against the
  // sale total first, and whatever's left over is cashed back to them. The cashback amount
  // defaults to the full leftover but can be typed in directly to adjust it.
  const creditUsed = mode === "sell" && selectedCustomer ? Math.min(customerCreditBalance, sellTotal) : 0;
  const leftoverCredit = mode === "sell" && selectedCustomer ? Math.max(0, customerCreditBalance - sellTotal) : 0;
  const creditCashbackNum =
    creditCashbackOverride !== "" ? parseFloat(creditCashbackOverride) : leftoverCredit;
  const creditCashback = Math.max(0, Math.min(leftoverCredit, isNaN(creditCashbackNum) ? 0 : creditCashbackNum));
  const dueAfterCredit = mode === "sell" ? Math.max(0, sellTotal - creditUsed) : total;

  const cashNum = parseFloat(cashGiven) || 0;
  const change = cashNum - dueAfterCredit;

  function setCart(updater) {
    setCarts((prev) => ({ ...prev, [mode]: updater(prev[mode]) }));
  }

  function addToCart(product) {
    setCart((prev) => {
      const existing = prev.find((i) => i.id === product.id);
      if (existing) {
        return prev.map((i) => (i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
      }
      return [...prev, { ...product, qty: 1, origValue: product.value }];
    });
  }

  function changeQty(id, delta) {
    setCart((prev) =>
      prev
        .map((i) => (i.id === id ? { ...i, qty: i.qty + delta } : i))
        .filter((i) => i.qty > 0)
    );
  }

  function removeItem(id) {
    setCart((prev) => prev.filter((i) => i.id !== id));
  }

  function updatePrice(id, newPrice) {
    setCart((prev) => prev.map((i) => (i.id === id ? { ...i, value: newPrice } : i)));
  }

  function updateItemRate(id, pct) {
    setCart((prev) => prev.map((i) => (i.id === id ? { ...i, customRatePct: pct } : i)));
  }

  function clearSale() {
    setCarts((prev) => ({ ...prev, [mode]: [] }));
    setPayMethod(null);
    setCashGiven("");
    setCashOutAmount(0);
    setCreditCashbackOverride("");
    setSelectedCustomerId("");
    setTradeCustomerName("");
    setNote("");
  }

  function switchMode(m) {
    setMode(m);
    setPayMethod(null);
    setCashGiven("");
    setCashOutAmount(0);
    setCreditCashbackOverride("");
    setSelectedCustomerId("");
    setTradeCustomerName("");
    setNote("");
  }

  function addCustomItem({ name, value, cat, ratePct, url, condition }) {
    setCart((prev) => [
      ...prev,
      {
        id: `custom-${Date.now()}`,
        name,
        value,
        cat,
        qty: 1,
        tag: "CUSTOM",
        customRatePct: ratePct,
        url: url || "",
        condition: condition || "",
      },
    ]);
  }

  function completeTransaction() {
    if (cart.length === 0) return;
    if (mode === "sell" && dueAfterCredit > 0 && (!payMethod || (payMethod === "cash" && cashNum < dueAfterCredit))) return;

    const costTotal = cart.reduce((s, i) => s + (i.cost || 0) * i.qty, 0);
    const resolvedCustomerName =
      mode === "trade" ? tradeCustomerName.trim() || "Walk-in customer" : selectedCustomer ? selectedCustomer.name : null;
    const sale = {
      id: Date.now(),
      mode,
      items: cart,
      rawTotal,
      total,
      customerName: resolvedCustomerName,
      dueAfterCredit: mode === "sell" ? dueAfterCredit : null,
      creditApplied: mode === "sell" ? creditUsed : 0,
      leftoverCredit: mode === "sell" ? leftoverCredit : 0,
      creditCashback: mode === "sell" ? creditCashback : 0,
      creditCashoutRatePct:
        mode === "sell" && leftoverCredit > 0
          ? Math.round((creditCashback / leftoverCredit) * 100)
          : null,
      cashOut: mode === "trade" ? cashOutCapped : 0,
      creditIssued: mode === "trade" ? creditPortion : mode === "sell" ? null : total,
      costTotal,
      profit: mode === "sell" ? total - costTotal : null,
      rate: mode === "buy" || mode === "trade" ? avgRatePct : null,
      method: mode === "sell" ? (dueAfterCredit === 0 ? "credit" : payMethod) : "cash",
      change: mode === "sell" && payMethod === "cash" ? change : 0,
      note: note.trim(),
      time: new Date(),
    };
    setHistory((h) => [sale, ...h]);

    if (mode === "trade") {
      setCustomers((prev) => {
        const idx = prev.findIndex((c) => c.name.toLowerCase() === resolvedCustomerName.toLowerCase());
        if (idx >= 0) {
          const next = [...prev];
          next[idx] = {
            ...next[idx],
            creditBalance: Math.round((next[idx].creditBalance + creditPortion) * 100) / 100,
          };
          return next;
        }
        return [...prev, { id: newProductId(), name: resolvedCustomerName, creditBalance: Math.round(creditPortion * 100) / 100 }];
      });
    }
    if (mode === "sell" && selectedCustomerId) {
      setCustomers((prev) =>
        prev.map((c) => (c.id === selectedCustomerId ? { ...c, creditBalance: 0 } : c))
      ); // fully redeemed this sale, no carry-over
    }
    if (mode === "buy") setFunds((f) => f - total);
    if (mode === "trade" && cashOutCapped > 0) setFunds((f) => f - cashOutCapped);
    if (mode === "sell") setFunds((f) => f + dueAfterCredit - creditCashback);

    if (mode === "sell") {
      setProducts((prev) =>
        prev
          .map((p) => {
            const soldItem = cart.find((i) => i.id === p.id);
            if (!soldItem || typeof p.stock !== "number") return p;
            return { ...p, stock: Math.max(0, p.stock - soldItem.qty) };
          })
          .filter((p) => typeof p.stock !== "number" || p.stock > 0)
      );
    }

    if (mode === "buy" || mode === "trade") {
      setProducts((prev) => {
        const next = [...prev];
        cart.forEach((item) => {
          const paidEach = item.value * (effectiveRatePct(item) / 100);
          const matchIdx = next.findIndex(
            (p) => p.name.trim().toLowerCase() === item.name.trim().toLowerCase() && p.cat === item.cat
          );
          if (matchIdx >= 0) {
            const existing = next[matchIdx];
            const oldStock = existing.stock || 0;
            const newStock = oldStock + item.qty;
            const newCost =
              newStock > 0 ? ((existing.cost || 0) * oldStock + paidEach * item.qty) / newStock : paidEach;
            next[matchIdx] = {
              ...existing,
              stock: newStock,
              cost: newCost,
              url: item.url ? item.url : existing.url,
              condition: item.condition ? item.condition : existing.condition,
            };
          } else {
            next.push({
              id: newProductId(),
              name: item.name,
              value: item.value,
              cost: paidEach,
              cat: item.cat,
              stock: item.qty,
              url: item.url || "",
              condition: item.condition || "",
              tag: (item.tag && item.tag !== "CUSTOM" ? item.tag : item.name.slice(0, 4)).toUpperCase(),
            });
          }
        });
        return next;
      });
    }

    setReceipt(sale);
    clearSale();
  }

  const todayRevenue = history.filter((h) => h.mode === "sell").reduce((s, h) => s + h.total, 0);
  const todayPayouts = history.filter((h) => h.mode === "buy").reduce((s, h) => s + h.total, 0);
  const todayCredit = history.filter((h) => h.mode === "trade").reduce((s, h) => s + h.total, 0);

  const activeMode = MODES[mode];
  const ModeIcon = activeMode.icon;
  const canComplete =
    cart.length > 0 &&
    (mode !== "sell" || dueAfterCredit === 0 || (payMethod && !(payMethod === "cash" && cashNum < dueAfterCredit)));

  if (!loaded) {
    return (
      <div style={styles.app}>
        <div style={styles.loadingWrap}>Loading your saved data…</div>
      </div>
    );
  }

  return (
    <div style={styles.app}>
      {saveError && (
        <div style={styles.saveErrorBanner}>
          Couldn't save your latest changes — they're still here for now, but try again in a moment.
        </div>
      )}
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        button { cursor: pointer; font-family: inherit; }
        .prod-btn:hover { border-color: #23262B; transform: translateY(-1px); }
        .prod-btn:active { transform: translateY(0); }
        .cat-pill:hover { background: #23262B; color: #F5F6F3; }
        .qty-btn:hover { background: #23262B; color: #F5F6F3; }
        .pay-btn:hover { border-color: #23262B; }
        .complete-btn:hover { filter: brightness(0.92); }
        .nav-btn:hover { border-color: #23262B; }
        .mode-tab:hover { border-color: #23262B; }
        .icon-btn:hover { background: #F0EEE8; }
        input[type=number]::-webkit-inner-spin-button { opacity: 0.5; }
      `}</style>

      {/* Header */}
      <div style={styles.header}>
        <div>
          <div style={styles.logo}>CARD VENDOR POS</div>
          <div style={styles.sub}>
            {fmt(todayRevenue)} sold · {fmt(todayPayouts)} paid out · {fmt(todayCredit)} credit issued · {fmt(totalCreditOwed)} credit owed
          </div>
        </div>
        <div style={styles.navRow}>
          <button
            className="nav-btn"
            style={{ ...styles.navBtn, ...(view === "register" ? styles.navBtnActive : {}) }}
            onClick={() => setView("register")}
          >
            Register
          </button>
          <button
            className="nav-btn"
            style={{ ...styles.navBtn, ...(view === "history" ? styles.navBtnActive : {}) }}
            onClick={() => setView("history")}
          >
            History
          </button>
          <button
            className="nav-btn"
            style={{ ...styles.navBtn, ...(view === "value" ? styles.navBtnActive : {}) }}
            onClick={() => setView("value")}
          >
            Value
          </button>
          <button
            className="nav-btn"
            style={{ ...styles.navBtn, ...(view === "settings" ? styles.navBtnActive : {}) }}
            onClick={() => setView("settings")}
          >
            <SettingsIcon size={13} style={{ marginRight: 4, verticalAlign: -2 }} />
            Settings
          </button>
        </div>
      </div>

      {view === "history" && (
        <ErrorBoundary>
          <HistoryView history={history} setHistory={setHistory} />
        </ErrorBoundary>
      )}

      {view === "value" && (
        <ErrorBoundary>
          <ValueView
            products={products}
            categories={categories}
            funds={funds}
            creditBalance={totalCreditOwed}
            history={history}
          />
        </ErrorBoundary>
      )}

      {view === "settings" && (
        <ErrorBoundary>
          <SettingsView
            categories={categories}
            setCategories={setCategories}
            products={products}
            setProducts={setProducts}
            history={history}
            setHistory={setHistory}
            customers={customers}
            setCustomers={setCustomers}
            shopName={shopName}
            setShopName={setShopName}
          />
        </ErrorBoundary>
      )}

      {view === "register" && (
        <ErrorBoundary>
        <>
          {/* Mode tabs */}
          <div style={styles.modeRow}>
            {Object.entries(MODES).map(([key, m]) => {
              const Icon = m.icon;
              const active = mode === key;
              return (
                <button
                  key={key}
                  className="mode-tab"
                  onClick={() => switchMode(key)}
                  style={{
                    ...styles.modeTab,
                    borderColor: active ? m.color : BORDER,
                    background: active ? m.bg : "#FFFFFF",
                    color: active ? m.color : INK,
                  }}
                >
                  <Icon size={15} />
                  {m.label}
                </button>
              );
            })}
            {mode !== "sell" && (
              <div style={styles.rateEditor}>
                <span style={styles.rateLabel}>{mode === "buy" ? "Buy" : "Trade"} rate</span>
                <input
                  type="number"
                  min="1"
                  max="100"
                  value={mode === "buy" ? buyRatePct : tradeRatePct}
                  onChange={(e) => {
                    const v = Math.max(1, Math.min(100, parseInt(e.target.value) || 0));
                    mode === "buy" ? setBuyRatePct(v) : setTradeRatePct(v);
                  }}
                  style={styles.rateInput}
                />
                <span style={styles.rateLabel}>% of value</span>
              </div>
            )}
          </div>

          <div style={styles.main}>
            {/* Products */}
            <div style={styles.productPane}>
              {mode === "sell" ? (
                <>
                  <div style={styles.searchRow}>
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Search products…"
                      style={styles.searchInput}
                    />
                    {searchQuery && (
                      <button style={styles.searchClearBtn} onClick={() => setSearchQuery("")} aria-label="Clear search">
                        <X size={13} />
                      </button>
                    )}
                  </div>
                  <div style={styles.catRow}>
                    <button
                      className="cat-pill"
                      onClick={() => setCategory("All")}
                      style={{
                        ...styles.catPill,
                        background: category === "All" ? "#23262B" : "transparent",
                        color: category === "All" ? "#F5F6F3" : "#23262B",
                      }}
                    >
                      All
                    </button>
                    {categories.map((c) => (
                      <button
                        key={c}
                        className="cat-pill"
                        onClick={() => setCategory(c)}
                        style={{
                          ...styles.catPill,
                          background: category === c ? "#23262B" : "transparent",
                          color: category === c ? "#F5F6F3" : "#23262B",
                        }}
                      >
                        {c}
                      </button>
                    ))}
                  </div>
                  {visibleProducts.length === 0 && (
                    <div style={styles.emptyCart}>
                      {searchQuery
                        ? `No products match "${searchQuery}".`
                        : "No products here yet. Add some in the Settings tab, or buy/trade something in to stock it."}
                    </div>
                  )}
                  <div style={styles.grid}>
                    {visibleProducts.map((p) => {
                      const inCartQty = cart.find((i) => i.id === p.id)?.qty || 0;
                      const remaining = typeof p.stock === "number" ? p.stock - inCartQty : null;
                      const isLow = remaining !== null && remaining <= 0;
                      return (
                        <div
                          key={p.id}
                          className="prod-btn"
                          role="button"
                          tabIndex={0}
                          style={styles.prodBtn}
                          onClick={() => addToCart(p)}
                          onKeyDown={(e) => {
                            if (e.key === "Enter" || e.key === " ") addToCart(p);
                          }}
                        >
                          {p.url && (
                            <button
                              style={styles.prodLinkBtn}
                              onClick={(e) => {
                                e.stopPropagation();
                                window.open(p.url, "_blank", "noopener,noreferrer");
                              }}
                              aria-label={`Open link for ${p.name}`}
                            >
                              <LinkIcon size={12} color={MUTED} />
                            </button>
                          )}
                          <div style={styles.tagRow}>
                            <div style={styles.prodTag}>{p.tag}</div>
                            {isSinglesCategory(p.cat) && (
                              <select
                                value={p.condition || ""}
                                onClick={(e) => e.stopPropagation()}
                                onChange={(e) => {
                                  const newCondition = e.target.value;
                                  setProducts((prev) =>
                                    prev.map((x) => (x.id === p.id ? { ...x, condition: newCondition } : x))
                                  );
                                }}
                                style={styles.conditionSelect}
                              >
                                <option value="">Condition</option>
                                {CONDITIONS.map((c) => (
                                  <option key={c.value} value={c.value}>{c.value}</option>
                                ))}
                              </select>
                            )}
                          </div>
                          <div style={styles.prodName}>{p.name}</div>
                          <div style={styles.prodPrice}>{fmt(p.value)}</div>
                          {typeof p.stock === "number" && (
                            <div style={{ ...styles.stockLabel, color: isLow ? "#B0413E" : MUTED }}>
                              {remaining < 0
                                ? `${Math.abs(remaining)} over stock`
                                : remaining === 0
                                ? "0 left"
                                : `${remaining} in stock`}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </>
              ) : (
                <>
                  {mode === "buy" && (
                    <FundsTracker funds={funds} setFunds={setFunds} pendingSpend={total} />
                  )}
                  <div style={styles.modeIntro}>
                    {mode === "buy"
                      ? "Enter what you're buying from the customer. Once you complete the purchase, it's added to your Sell catalog automatically."
                      : "Enter what you're taking in trade. Once you complete the trade, it's added to your Sell catalog automatically."}
                  </div>
                  {mode === "trade" && (
                    <div style={styles.customerNameBlock}>
                      <label style={styles.customLabel}>Whose credit is this?</label>
                      <input
                        style={styles.customInput}
                        list="customer-names"
                        placeholder="Type a name (existing or new)"
                        value={tradeCustomerName}
                        onChange={(e) => setTradeCustomerName(e.target.value)}
                      />
                      <datalist id="customer-names">
                        {customers.map((c) => (
                          <option key={c.id} value={c.name} />
                        ))}
                      </datalist>
                    </div>
                  )}
                  <CustomItemPanel
                    mode={mode}
                    categories={categories}
                    defaultRate={mode === "buy" ? buyRatePct : tradeRatePct}
                    onAdd={(item) => addCustomItem(item)}
                    forceOpen
                  />
                  {cart.length > 0 && (
                    <div style={styles.pendingList}>
                      <div style={styles.pendingHeading}>
                        Added to this {mode} ({cart.length})
                      </div>
                      {cart.map((item, idx) => (
                        <div
                          key={item.id}
                          style={{
                            ...styles.pendingRow,
                            borderBottom: idx === cart.length - 1 ? "none" : `1px solid ${BORDER}`,
                          }}
                        >
                          <span style={styles.pendingName}>{item.qty}× {item.name}</span>
                          <span style={styles.pendingCat}>{item.cat}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </>
              )}
            </div>

            {/* Cart / receipt panel */}
            <div style={styles.cartPane}>
              <div style={styles.cartCard}>
                <div style={{ ...styles.cartHeader, color: activeMode.color }}>
                  <ModeIcon size={13} style={{ marginRight: 5, verticalAlign: -2 }} />
                  Current {activeMode.label.toLowerCase()}
                </div>

                <div style={styles.cartItems}>
                  {cart.length === 0 && (
                    <div style={styles.emptyCart}>
                      Tap an item to {mode === "sell" ? "add it to the sale" : mode === "buy" ? "buy it from the customer" : "trade it in"}.
                    </div>
                  )}
                  {cart.map((item) => {
                    const lineRatePct = effectiveRatePct(item);
                    const lineOffer = mode === "sell" ? item.value : item.value * (lineRatePct / 100);
                    return (
                      <div key={item.id} style={styles.cartRow}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={styles.cartItemName}>
                            {item.name}
                            {item.condition && <span style={styles.cartItemCondition}> ({item.condition})</span>}
                          </div>
                          {mode === "sell" ? (
                            <div style={styles.priceEditRow}>
                              <span style={styles.priceEditDollar}>$</span>
                              <input
                                type="number"
                                step="0.01"
                                min="0"
                                value={item.value}
                                onChange={(e) => updatePrice(item.id, Math.max(0, parseFloat(e.target.value) || 0))}
                                style={styles.priceEditInput}
                              />
                              <span style={styles.priceEditLabel}>each</span>
                              {typeof item.origValue === "number" && item.value !== item.origValue && (
                                <span style={styles.priceWasLabel}>was {fmt(item.origValue)}</span>
                              )}
                            </div>
                          ) : (
                            <div style={styles.rateEditRowSmall}>
                              <span style={styles.cartItemUnit}>{fmt(item.value)} value ·</span>
                              <input
                                type="number"
                                min="1"
                                max="100"
                                value={lineRatePct}
                                onChange={(e) => {
                                  const v = Math.max(1, Math.min(100, parseInt(e.target.value) || 0));
                                  updateItemRate(item.id, v);
                                }}
                                style={styles.priceEditInput}
                              />
                              <span style={styles.cartItemUnit}>% = {fmt(lineOffer)} each</span>
                            </div>
                          )}
                        </div>
                        <div style={styles.qtyGroup}>
                          <button className="qty-btn" style={styles.qtyBtn} onClick={() => changeQty(item.id, -1)}>
                            <Minus size={12} />
                          </button>
                          <span style={styles.qtyNum}>{item.qty}</span>
                          <button className="qty-btn" style={styles.qtyBtn} onClick={() => changeQty(item.id, 1)}>
                            <Plus size={12} />
                          </button>
                        </div>
                        <div style={styles.cartItemTotal}>{fmt(lineOffer * item.qty)}</div>
                        <button style={styles.removeBtn} onClick={() => removeItem(item.id)} aria-label="Remove item">
                          <Trash2 size={14} />
                        </button>
                      </div>
                    );
                  })}
                </div>

                <div style={styles.totalsBlock}>
                  {mode === "sell" && <Row label="Subtotal" value={fmt(rawTotal)} />}
                  {mode !== "sell" && <Row label="Item value" value={fmt(rawTotal)} />}
                  {mode !== "sell" && (
                    <Row
                      label={`${mode === "buy" ? "Buy" : "Trade"} rate (avg)`}
                      value={`${avgRatePct}%`}
                    />
                  )}
                  {mode === "sell" && creditUsed > 0 && (
                    <Row label="Store credit applied" value={`− ${fmt(creditUsed)}`} />
                  )}
                  {mode === "trade" && cashOutCapped > 0 && (
                    <>
                      <Row label="Paid as cash" value={fmt(cashOutCapped)} />
                      <Row label="Issued as credit" value={fmt(creditPortion)} />
                    </>
                  )}
                  <div style={styles.totalRow}>
                    <span>
                      {mode === "sell" ? "Due now" : mode === "buy" ? "Cash to pay out" : "Trade value"}
                    </span>
                    <span>{fmt(mode === "sell" ? dueAfterCredit : total)}</span>
                  </div>
                </div>

                {mode === "sell" && customers.some((c) => c.creditBalance >= 0.01) && cart.length > 0 && (
                  <div style={styles.creditBox}>
                    <div style={styles.creditBoxHeading}>Apply a customer's store credit</div>
                    <select
                      style={styles.customInput}
                      value={selectedCustomerId}
                      onChange={(e) => {
                        setSelectedCustomerId(e.target.value);
                        setCreditCashbackOverride("");
                      }}
                    >
                      <option value="">No customer credit</option>
                      {customers
                        .filter((c) => c.creditBalance >= 0.01)
                        .map((c) => (
                          <option key={c.id} value={c.id}>
                            {c.name} — {fmt(c.creditBalance)} credit
                          </option>
                        ))}
                    </select>

                    {selectedCustomer && (
                      <>
                        <div style={{ marginTop: 10 }}>
                          <Row label="Applied to this sale" value={fmt(creditUsed)} />
                        </div>
                        {leftoverCredit > 0 && (
                          <>
                            <Row label="Remaining after sale" value={fmt(leftoverCredit)} />
                            <div style={styles.cashbackRateRow}>
                              <span style={styles.rateLabel}>Cash back to {selectedCustomer.name}</span>
                              <span style={styles.priceEditDollar}>$</span>
                              <input
                                type="number"
                                min="0"
                                max={leftoverCredit}
                                step="0.01"
                                value={creditCashbackOverride !== "" ? creditCashbackOverride : leftoverCredit.toFixed(2)}
                                onChange={(e) => setCreditCashbackOverride(e.target.value)}
                                style={styles.priceEditInput}
                              />
                              {creditCashbackOverride !== "" && (
                                <button style={styles.creditClearBtn} onClick={() => setCreditCashbackOverride("")}>
                                  Reset to full amount
                                </button>
                              )}
                            </div>
                            {creditCashback > funds && (
                              <div style={styles.fundsWarning}>
                                That's {fmt(creditCashback - funds)} more than you have in available funds.
                              </div>
                            )}
                          </>
                        )}
                      </>
                    )}
                  </div>
                )}

                {mode === "trade" && cart.length > 0 && (
                  <div style={styles.creditBox}>
                    <div style={styles.creditBoxHeading}>
                      Doesn't want the rest as store credit? Pay some out as cash instead.
                    </div>
                    <div style={styles.creditApplyRow}>
                      <span style={styles.priceEditDollar}>$</span>
                      <input
                        type="number"
                        min="0"
                        max={total}
                        step="0.01"
                        value={cashOutAmount || ""}
                        placeholder="0.00"
                        onChange={(e) => setCashOutAmount(Math.max(0, parseFloat(e.target.value) || 0))}
                        style={styles.priceEditInput}
                      />
                      <button style={styles.creditMaxBtn} onClick={() => setCashOutAmount(total)}>
                        All as cash
                      </button>
                      {cashOutAmount > 0 && (
                        <button style={styles.creditClearBtn} onClick={() => setCashOutAmount(0)}>
                          Clear
                        </button>
                      )}
                    </div>
                    {cashOutCapped > funds && (
                      <div style={styles.fundsWarning}>
                        That's {fmt(cashOutCapped - funds)} more than you have in available funds.
                      </div>
                    )}
                  </div>
                )}

                {cart.length > 0 && (
                  <div style={styles.payBlock}>
                    {mode === "sell" && dueAfterCredit === 0 && (
                      <div style={styles.creditCoveredNote}>
                        Fully covered by store credit — no payment needed.
                      </div>
                    )}
                    {mode === "sell" && dueAfterCredit > 0 && (
                      <>
                        <div style={styles.payButtons}>
                          <button
                            className="pay-btn"
                            style={{ ...styles.payBtn, ...(payMethod === "cash" ? styles.payBtnActive : {}) }}
                            onClick={() => setPayMethod("cash")}
                          >
                            Cash
                          </button>
                          <button
                            className="pay-btn"
                            style={{ ...styles.payBtn, ...(payMethod === "card" ? styles.payBtnActive : {}) }}
                            onClick={() => { setPayMethod("card"); setCashGiven(""); }}
                          >
                            Card
                          </button>
                        </div>
                        {payMethod === "cash" && (
                          <div style={styles.cashRow}>
                            <input
                              type="number"
                              placeholder="Cash received"
                              value={cashGiven}
                              onChange={(e) => setCashGiven(e.target.value)}
                              style={styles.cashInput}
                              min="0"
                              step="0.01"
                            />
                            <div style={styles.changeText}>
                              {cashNum > 0
                                ? change >= 0
                                  ? `Change due: ${fmt(change)}`
                                  : `Need ${fmt(-change)} more`
                                : "Enter amount tendered"}
                            </div>
                          </div>
                        )}
                      </>
                    )}

                    <div style={styles.noteBlock}>
                      <label style={styles.noteLabel}>Note (optional)</label>
                      <textarea
                        value={note}
                        onChange={(e) => setNote(e.target.value)}
                        placeholder={
                          mode === "sell"
                            ? "e.g. customer name, discount reason…"
                            : mode === "buy"
                            ? "e.g. condition, seller name…"
                            : "e.g. what they wanted in return…"
                        }
                        style={styles.noteInput}
                        rows={2}
                        maxLength={280}
                      />
                    </div>

                    <button
                      className="complete-btn"
                      style={{
                        ...styles.completeBtn,
                        background: activeMode.color,
                        opacity: canComplete ? 1 : 0.4,
                        pointerEvents: canComplete ? "auto" : "none",
                      }}
                      onClick={completeTransaction}
                    >
                      <Check size={16} />
                      {mode === "sell" && `Complete sale · ${fmt(dueAfterCredit)}`}
                      {mode === "buy" && `Pay out ${fmt(total)} cash`}
                      {mode === "trade" && cashOutCapped === 0 && `Issue ${fmt(total)} store credit`}
                      {mode === "trade" && cashOutCapped > 0 && cashOutCapped < total &&
                        `Issue ${fmt(creditPortion)} credit + pay ${fmt(cashOutCapped)} cash`}
                      {mode === "trade" && cashOutCapped >= total && `Pay out ${fmt(cashOutCapped)} cash`}
                    </button>

                    <button style={styles.clearBtn} onClick={clearSale}>
                      Clear {activeMode.label.toLowerCase()}
                    </button>
                  </div>
                )}

                <div style={styles.perforation}>
                  {Array.from({ length: 26 }).map((_, i) => (
                    <div key={i} style={styles.notch} />
                  ))}
                </div>
              </div>
            </div>
          </div>
        </>
        </ErrorBoundary>
      )}

      {receipt && <ReceiptModal sale={receipt} onClose={() => setReceipt(null)} />}
    </div>
  );
}

function FundsTracker({ funds, setFunds, pendingSpend }) {
  const [adding, setAdding] = useState(false);
  const [amount, setAmount] = useState("");

  const afterSpend = funds - (pendingSpend || 0);
  const overBudget = pendingSpend > 0 && pendingSpend > funds;

  function submitAdd() {
    const v = parseFloat(amount);
    if (isNaN(v) || v === 0) return;
    setFunds((f) => f + v);
    setAmount("");
    setAdding(false);
  }

  return (
    <div style={styles.fundsBox}>
      <div style={styles.fundsRow}>
        <div>
          <div style={styles.fundsLabel}>Available funds</div>
          <div style={styles.fundsValue}>{fmt(funds)}</div>
        </div>
        {!adding ? (
          <button style={styles.fundsAddBtn} onClick={() => setAdding(true)}>
            <Plus size={13} /> Add / remove funds
          </button>
        ) : (
          <div style={styles.fundsAddRow}>
            <input
              type="number"
              step="0.01"
              placeholder="+50 or -20"
              value={amount}
              onChange={(e) => setAmount(e.target.value)}
              style={styles.fundsAddInput}
              autoFocus
              onKeyDown={(e) => e.key === "Enter" && submitAdd()}
            />
            <button style={styles.fundsAddConfirm} onClick={submitAdd}>Save</button>
            <button style={styles.fundsAddCancel} onClick={() => { setAdding(false); setAmount(""); }}>
              <X size={13} />
            </button>
          </div>
        )}
      </div>
      {pendingSpend > 0 && (
        <div style={{ ...styles.fundsNote, color: overBudget ? "#B0413E" : MUTED }}>
          {overBudget
            ? `This buy (${fmt(pendingSpend)}) is ${fmt(pendingSpend - funds)} over your available funds.`
            : `After this buy: ${fmt(afterSpend)} left`}
        </div>
      )}
    </div>
  );
}

function CustomItemPanel({ mode, categories, defaultRate, onAdd, forceOpen }) {
  const [open, setOpen] = useState(!!forceOpen);
  const [cat, setCat] = useState(categories[0] || "");
  const [name, setName] = useState("");
  const [value, setValue] = useState("");
  const [ratePct, setRatePct] = useState(defaultRate);
  const [manualOffer, setManualOffer] = useState("");
  const [url, setUrl] = useState("");
  const [condition, setCondition] = useState("");

  function openPanel() {
    setCat((c) => c || categories[0] || "");
    setRatePct(defaultRate);
    setManualOffer("");
    setOpen(true);
  }

  function closePanel() {
    if (!forceOpen) setOpen(false);
    setName("");
    setValue("");
    setRatePct(defaultRate);
    setManualOffer("");
    setUrl("");
    setCondition("");
  }

  function submit() {
    const cleanName = name.trim();
    const v = parseFloat(value);
    if (!cat || !cleanName || isNaN(v) || v < 0) return;
    const overrideNum = manualOffer !== "" ? parseFloat(manualOffer) : NaN;
    const finalRatePct =
      !isNaN(overrideNum) && v > 0
        ? Math.max(1, Math.min(100, (overrideNum / v) * 100))
        : Math.max(1, Math.min(100, ratePct || 1));
    onAdd({
      name: cleanName,
      value: v,
      cat,
      ratePct: finalRatePct,
      url: url.trim(),
      condition: isSinglesCategory(cat) ? condition : "",
    });
    closePanel();
  }

  if (!open) {
    return (
      <button className="prod-btn" style={styles.customTile} onClick={openPanel}>
        <Plus size={16} />
        <span>Add item not in catalog</span>
      </button>
    );
  }

  const marketValueNum = parseFloat(value) || 0;
  const offerPreview = marketValueNum * (ratePct / 100);
  const hasOverride = manualOffer !== "";

  return (
    <div style={styles.customPanel}>
      <div style={styles.customPanelHeading}>
        {mode === "buy" ? "Buy an item from a customer" : "Trade in an item"}
      </div>

      <label style={styles.customLabel}>1. Category</label>
      <select style={styles.customInput} value={cat} onChange={(e) => setCat(e.target.value)}>
        {categories.map((c) => (
          <option key={c} value={c}>{c}</option>
        ))}
      </select>

      {isSinglesCategory(cat) && (
        <>
          <label style={styles.customLabel}>Condition</label>
          <select
            style={styles.customInput}
            value={condition}
            onChange={(e) => setCondition(e.target.value)}
          >
            <option value="">Not specified</option>
            {CONDITIONS.map((c) => (
              <option key={c.value} value={c.value}>{c.label}</option>
            ))}
          </select>
        </>
      )}

      <label style={styles.customLabel}>2. What is it?</label>
      <input
        style={styles.customInput}
        placeholder="e.g. Blastoise 1st Edition"
        value={name}
        onChange={(e) => setName(e.target.value)}
        autoFocus
      />

      <label style={styles.customLabel}>3. Market value</label>
      <div style={styles.customValueRow}>
        <span style={styles.priceEditDollar}>$</span>
        <input
          style={styles.customInput}
          type="number"
          step="0.01"
          min="0"
          placeholder="0.00"
          value={value}
          onChange={(e) => setValue(e.target.value)}
        />
      </div>

      <label style={styles.customLabel}>
        4. % of value to offer{hasOverride && <span style={styles.overrideNote}> (overridden below)</span>}
      </label>
      <div style={{ ...styles.customRateRow, opacity: hasOverride ? 0.4 : 1 }}>
        <input
          type="range"
          min="1"
          max="100"
          value={ratePct}
          disabled={hasOverride}
          onChange={(e) => {
            setManualOffer("");

          }}

        />
        <span style={styles.customRateValue}>{Math.round(ratePct)}%</span>
      </div>

      <label style={styles.customLabel}>
        Or type an exact {mode === "buy" ? "cash offer" : "offer"} to override the slider
      </label>
      <div style={styles.customOfferRow}>
        <span style={styles.priceEditDollar}>$</span>
        <input
          style={{ ...styles.customInput, width: "auto", flex: 1, minWidth: 0 }}
          type="number"
          step="0.01"

          disabled={!marketValueNum}
          placeholder={marketValueNum ? "0.00" : "Enter market value first"}
          value={hasOverride ? manualOffer : marketValueNum ? offerPreview.toFixed(2) : ""}

function formatDayLabel(date) {
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((startOfDay(new Date()) - startOfDay(date)) / 86400000);
  if (diffDays === 0) return "Today";
  if (diffDays === 1) return "Yesterday";
  return date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
}

function groupHistoryByDay(history) {
  const groups = [];
  let current = null;
  history.forEach((sale) => {
    const label = formatDayLabel(sale.time);
    if (!current || current.label !== label) {
      current = { label, sales: [] };
      groups.push(current);
    }
    current.sales.push(sale);
  });
  return groups;
}

function HistoryView({ history, setHistory }) {
  const [editingId, setEditingId] = useState(null);
  const [noteDraft, setNoteDraft] = useState("");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  function startEdit(sale) {
    setEditingId(sale.id);
    setNoteDraft(sale.note || "");
    setConfirmDeleteId(null);
  }

  function saveEdit(saleId) {
    setHistory((prev) =>
      prev.map((s) => (s.id === saleId ? { ...s, note: noteDraft.trim() } : s))
    );
    setEditingId(null);
    setNoteDraft("");
  }

  function cancelEdit() {
    setEditingId(null);
    setNoteDraft("");
  }

  function deleteEntry(saleId) {
    setHistory((prev) => prev.filter((s) => s.id !== saleId));
    setConfirmDeleteId(null);
  }

  const sells = history.filter((h) => h.mode === "sell");
  const buys = history.filter((h) => h.mode === "buy");
  const trades = history.filter((h) => h.mode === "trade");

  const totalSold = sells.reduce((s, h) => s + h.total, 0);
  const totalCost = sells.reduce((s, h) => s + h.costTotal, 0);
  const totalProfit = sells.reduce((s, h) => s + (h.profit || 0), 0);
  const totalPaidOut = buys.reduce((s, h) => s + h.total, 0);
  const totalCredit = trades.reduce((s, h) => s + h.total, 0);
  const marginPct = totalSold > 0 ? (totalProfit / totalSold) * 100 : 0;

  const dayGroups = groupHistoryByDay(history);

  return (
    <div style={styles.historyWrap}>
      {history.length === 0 ? (
        <div style={styles.emptyCart}>No transactions yet today.</div>
      ) : (
        <>
          <div style={styles.totalsGrid}>
            <TotalStat label="Sold" value={fmt(totalSold)} color={MODES.sell.color} />
            <TotalStat label="Cost of goods" value={fmt(totalCost)} color={MUTED} />
            <TotalStat
              label="Profit"
              value={`${fmt(totalProfit)} (${marginPct.toFixed(0)}%)`}
              color={totalProfit >= 0 ? TEAL : "#B0413E"}
            />
            <TotalStat label="Paid out" value={fmt(totalPaidOut)} color={MODES.buy.color} />
            <TotalStat label="Credit issued" value={fmt(totalCredit)} color={MODES.trade.color} />
          </div>

          {dayGroups.map((group, gi) => {
            const daySold = group.sales.filter((s) => s.mode === "sell").reduce((s, h) => s + h.total, 0);
            const dayProfit = group.sales
              .filter((s) => s.mode === "sell")
              .reduce((s, h) => s + (h.profit || 0), 0);
            const dayPaidOut = group.sales.filter((s) => s.mode === "buy").reduce((s, h) => s + h.total, 0);
            const dayCredit = group.sales.filter((s) => s.mode === "trade").reduce((s, h) => s + h.total, 0);
            return (
              <div key={gi} style={styles.dayGroup}>
                <div style={styles.dayGroupHeader}>
                  <span style={styles.dayGroupLabel}>{group.label}</span>
                  <span style={styles.dayGroupStats}>
                    {daySold > 0 && `${fmt(daySold)} sold`}
                    {daySold > 0 && dayProfit !== 0 && ` · ${fmt(dayProfit)} profit`}
                    {dayPaidOut > 0 && `${daySold > 0 ? " · " : ""}${fmt(dayPaidOut)} paid out`}
                    {dayCredit > 0 && `${daySold > 0 || dayPaidOut > 0 ? " · " : ""}${fmt(dayCredit)} credit`}
                  </span>
                </div>
                <div style={styles.historyList}>
                  {group.sales.map((sale) => {
                    const m = MODES[sale.mode];
                    const isEditing = editingId === sale.id;
                    const isConfirmingDelete = confirmDeleteId === sale.id;
                    return (
                      <div key={sale.id} style={styles.historyRow}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={styles.historyTime}>
                            {sale.time.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                          </div>
                          <div style={styles.historyItems}>
                            {sale.items.map((i, idx) => (
                              <span key={i.id || idx}>
                                {idx > 0 && ", "}
                                {i.qty}× {i.name}
                                {sale.mode === "sell" &&
                                  typeof i.origValue === "number" &&
                                  i.origValue !== i.value && (
                                    <span style={styles.historyPriceAdjusted}>
                                      {" "}
                                      (was {fmt(i.origValue)}, sold {fmt(i.value)})
                                    </span>
                                  )}
                              </span>
                            ))}
                          </div>
                          {sale.customerName && (sale.mode === "trade" || sale.creditApplied > 0) && (
                            <div style={styles.historyCustomerName}>{sale.customerName}</div>
                          )}                          {sale.mode === "sell" && (
                            <div style={{ ...styles.historyMargin, color: sale.profit >= 0 ? TEAL : "#B0413E" }}>
                              {fmt(sale.profit)} profit
                              {sale.total > 0 && ` (${((sale.profit / sale.total) * 100).toFixed(0)}%)`}
                            </div>
                          )}
                          {sale.mode === "sell" && sale.creditApplied > 0 && (
                            <div style={styles.historyCreditNote}>
                              {fmt(sale.creditApplied)} paid with store credit
                              {sale.creditCashback > 0 && ` · ${fmt(sale.creditCashback)} cash back (${sale.creditCashoutRatePct}%)`}
                            </div>
                          )}

                          {isEditing ? (
                            <div style={styles.historyEditBlock}>
                              <textarea
                                value={noteDraft}
                                onChange={(e) => setNoteDraft(e.target.value)}
                                placeholder="Note for this transaction…"
                                style={styles.historyEditInput}
                                rows={2}
                                maxLength={280}
                                autoFocus
                              />
                              <div style={styles.historyEditBtnRow}>
                                <button style={styles.historyEditSaveBtn} onClick={() => saveEdit(sale.id)}>
                                  Save
                                </button>
                                <button style={styles.historyEditCancelBtn} onClick={cancelEdit}>
                                  Cancel
                                </button>
                              </div>
                            </div>
                          ) : (
                            sale.note && <div style={styles.historyNote}>"{sale.note}"</div>
                          )}

                          {isConfirmingDelete && (
                            <div style={styles.historyDeleteConfirm}>
                              <span style={styles.historyDeleteText}>
                                Delete this transaction? This only removes the log entry — it won't undo any funds, stock, or credit changes.
                              </span>
                              <div style={styles.historyEditBtnRow}>
                                <button style={styles.historyDeleteConfirmBtn} onClick={() => deleteEntry(sale.id)}>
                                  Yes, delete
                                </button>
                                <button style={styles.historyEditCancelBtn} onClick={() => setConfirmDeleteId(null)}>
                                  Cancel
                                </button>
                              </div>
                            </div>
                          )}
                        </div>
                        <div style={styles.historyMeta}>
                          <span style={{ ...styles.historyMethod, color: m.color, background: m.bg }}>
                            {m.label}
                            {sale.rate ? ` · ${sale.rate}%` : ""}
                          </span>
                          <span style={styles.historyTotal}>{fmt(sale.total)}</span>
                          {!isEditing && !isConfirmingDelete && (
                            <div style={styles.historyRowActions}>
                              <button
                                className="icon-btn"
                                style={styles.historyActionBtn}
                                onClick={() => startEdit(sale)}
                                aria-label="Edit note"
                              >
                                <Pencil size={12} color={MUTED} />
                              </button>
                              <button
                                className="icon-btn"
                                style={styles.historyActionBtn}
                                onClick={() => setConfirmDeleteId(sale.id)}
                                aria-label="Delete transaction"
                              >
                                <Trash2 size={12} color={MUTED} />
                              </button>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}

function ValueView({ products, categories, funds, creditBalance, history }) {
  const inventoryValue = products.reduce((s, p) => s + (p.stock || 0) * p.value, 0);
  const inventoryCost = products.reduce((s, p) => s + (p.stock || 0) * (p.cost || 0), 0);
  const potentialProfit = inventoryValue - inventoryCost;
  const totalItems = products.reduce((s, p) => s + (p.stock || 0), 0);
  const netPosition = funds + inventoryValue - creditBalance;

  // Realized profit margin: based on actual completed sales, not just theoretical inventory value.
  const sells = history.filter((h) => h.mode === "sell");
  const realizedRevenue = sells.reduce((s, h) => s + h.total, 0);
  const realizedProfit = sells.reduce((s, h) => s + (h.profit || 0), 0);
  const realizedMarginPct = realizedRevenue > 0 ? (realizedProfit / realizedRevenue) * 100 : 0;

  // Cash vs. inventory allocation
  const totalAssets = funds + inventoryValue;
  const cashPct = totalAssets > 0 ? (funds / totalAssets) * 100 : 0;
  const inventoryPct = totalAssets > 0 ? 100 - cashPct : 0;

  const byCategory = categories.map((c) => {
    const catProducts = products.filter((p) => p.cat === c);
    const items = catProducts.reduce((s, p) => s + (p.stock || 0), 0);
    const value = catProducts.reduce((s, p) => s + (p.stock || 0) * p.value, 0);
    const cost = catProducts.reduce((s, p) => s + (p.stock || 0) * (p.cost || 0), 0);
    return { name: c, items, value, cost, profit: value - cost };
  });

  return (
    <div style={styles.historyWrap}>
      <div style={styles.totalsGrid}>
        <TotalStat label="Available funds" value={fmt(funds)} color={MODES.buy.color} />
        <TotalStat label="Store credit owed" value={fmt(creditBalance)} color={MODES.trade.color} />
        <TotalStat label="Inventory value" value={fmt(inventoryValue)} color={MODES.sell.color} />
        <TotalStat label="Inventory cost" value={fmt(inventoryCost)} color={MUTED} />
        <TotalStat
          label="Potential profit"
          value={fmt(potentialProfit)}
          color={potentialProfit >= 0 ? TEAL : "#B0413E"}
        />
        <TotalStat
          label="Profit margin (actual)"
          value={`${realizedMarginPct.toFixed(1)}%`}
          color={realizedProfit >= 0 ? TEAL : "#B0413E"}
        />
      </div>

      <div style={styles.valueNetRow}>
        <span style={styles.valueNetLabel}>
          Net position (funds + inventory value − credit owed)
        </span>
        <span style={{ ...styles.valueNetAmount, color: netPosition >= 0 ? TEAL : "#B0413E" }}>
          {fmt(netPosition)}
        </span>
      </div>

      <div style={styles.settingsHeading2}>Where your money is</div>
      {totalAssets <= 0 ? (
        <div style={styles.emptyCart}>No funds or inventory value tracked yet.</div>
      ) : (
        <div style={styles.allocationBox}>
          <div style={styles.allocationBar}>
            <div
              style={{
                ...styles.allocationSegment,
                width: `${cashPct}%`,
                background: MODES.buy.color,
                borderRadius: inventoryPct <= 0 ? "8px" : "8px 0 0 8px",
              }}
            />
            <div
              style={{
                ...styles.allocationSegment,
                width: `${inventoryPct}%`,
                background: MODES.sell.color,
                borderRadius: cashPct <= 0 ? "8px" : "0 8px 8px 0",
              }}
            />
          </div>
          <div style={styles.allocationLegend}>
            <div style={styles.allocationLegendItem}>
              <span style={{ ...styles.allocationDot, background: MODES.buy.color }} />
              Cash — {fmt(funds)} ({cashPct.toFixed(0)}%)
            </div>
            <div style={styles.allocationLegendItem}>
              <span style={{ ...styles.allocationDot, background: MODES.sell.color }} />
              Inventory — {fmt(inventoryValue)} ({inventoryPct.toFixed(0)}%)
            </div>
          </div>
        </div>
      )}

      <div style={styles.settingsHeading2}>By category ({totalItems} items in stock)</div>
      {byCategory.length === 0 ? (
        <div style={styles.emptyCart}>No categories yet.</div>
      ) : (
        <div style={styles.catValueTable}>
          <div style={styles.catValueHead}>
            <span style={{ flex: 2 }}>Category</span>
            <span style={{ width: 60 }}>Items</span>
            <span style={{ width: 90 }}>Value</span>
            <span style={{ width: 90 }}>Cost</span>
            <span style={{ width: 90 }}>Profit</span>
          </div>
          {byCategory.map((c) => (
            <div key={c.name} style={styles.catValueRow}>
              <span style={{ flex: 2, fontWeight: 500 }}>{c.name}</span>
              <span style={{ width: 60, color: MUTED }}>{c.items}</span>
              <span style={{ width: 90, fontFamily: "'IBM Plex Mono', monospace" }}>{fmt(c.value)}</span>
              <span style={{ width: 90, fontFamily: "'IBM Plex Mono', monospace", color: MUTED }}>
                {fmt(c.cost)}
              </span>
              <span
                style={{
                  width: 90,
                  fontFamily: "'IBM Plex Mono', monospace",
                  fontWeight: 600,
                  color: c.profit >= 0 ? TEAL : "#B0413E",
                }}
              >
                {fmt(c.profit)}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
